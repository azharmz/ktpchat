name: tg-highlight

on:
  schedule:
    # Tiap 2 jam (12x/hari) — jauh di bawah limit free tier Gemini (min. 250 request/hari)
    - cron: '0 */2 * * *'
  workflow_dispatch: {}  # bisa trigger manual dari tab Actions untuk testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # pengaman: kalau job kelamaan (grup terlalu aktif), auto-stop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python ingest.py
